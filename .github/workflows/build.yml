name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Re-create iOS Project Platform Files
        run: |
          flutter create . --platforms=ios --org com.ebookreader

      - name: Set iOS Minimum Deployment Target to 9.0
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 9.0;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/platform :ios, .*/platform :ios, '\''9.0'\''/g' ios/Podfile || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/ || cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r EbookReader.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookReader-IPA
          path: EbookReader.ipa