name: Build iPad 3 (iOS 9) IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App
        run: |
          cordova create ebookapp com.ebookreader.ipad3 EbookReader
          cd ebookapp
          cordova platform add ios@5.1.1

      - name: Add Web Ebook Reader Code
        run: |
          cat << 'EOF' > ebookapp/www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
              <title>Ebook Reader iPad 3</title>
              <style>
                  body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; text-align: center; }
                  h2 { color: #333; }
                  input[type="file"] { display: none; }
                  .btn { background: #007aff; color: white; padding: 12px 24px; border-radius: 8px; display: inline-block; font-size: 18px; margin: 20px 0; cursor: pointer; }
                  #viewer { width: 100%; height: 80vh; border: 1px solid #ccc; background: #fff; margin-top: 10px; }
              </style>
          </head>
          <body>
              <h2>Tủ Sách iPad 3</h2>
              <label class="btn" for="file-input">📖 Chọn file PDF từ iPad</label>
              <input type="file" id="file-input" accept="application/pdf">
              <iframe id="viewer"></iframe>

              <script>
                  document.getElementById('file-input').addEventListener('change', function(e) {
                      var file = e.target.files[0];
                      if (file) {
                          var url = URL.createObjectURL(file);
                          document.getElementById('viewer').src = url;
                      }
                  });
              </script>
          </body>
          </html>
          EOF

      - name: Set iOS Minimum Deployment Target to 8.0
        run: |
          cd ebookapp
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 8.0;/g' platforms/ios/EbookReader.xcodeproj/project.pbxproj

      - name: Build Cordova iOS (Unsigned)
        run: |
          cd ebookapp
          cordova build ios --no-telemetry -- --emulator

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r ebookapp/platforms/ios/build/emulator/EbookReader.app Payload/
          zip -r EbookReader_iPad3.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EbookReader-iPad3-IPA
          path: EbookReader_iPad3.ipa